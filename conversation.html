<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能问答 · GreenMate</title><link rel="stylesheet" href="/static/app.css"><script src="/static/app.js" defer></script><script src="/static/conversation.js" defer></script></head><body class="page-conversation"><header class="site-head"><div class="head-inner"><a class="brand" href="/" aria-label="GreenMate 首页"><svg class="mark" viewBox="0 0 38 44" aria-hidden="true"><path d="M19 41V16M19 27C4 27 3 16 4 9c10 0 15 6 15 18ZM19 20C32 20 35 9 33 3c-9 0-14 7-14 17Z" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/></svg><div><span class="brand-name">GreenMate</span><p class="subtitle">植物养护工作台</p></div></a><nav aria-label="页面导航"><a href="/">首页</a><a href="/environment">环境</a><a href="/conversation" aria-current="page">问答</a><a href="/knowledge">知识</a><a href="/prediction">预测</a><a href="/analysis">分析</a></nav></div></header><main><section class="page-banner"><div class="photo "><img src="/assets/img/scene-conversation.jpg" width="1600" height="1000" loading="lazy" decoding="async" alt="窗边木桌上的空白笔记、铅笔与番茄苗" onerror="this.closest('.photo')?.classList.add('img-fallback')"><svg class="photo-fallback" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M50 88V30M50 57C20 57 19 36 23 22c22 0 27 16 27 35ZM50 44C77 44 82 21 76 10 56 12 50 24 50 44Z"/></svg></div><div class="banner-copy"><h1>智能问答</h1><p>从一个问题开始，让读数、记忆与工具成为有据可查的回答。</p><span>场景配图 · 非观测证据</span></div></section><div class="page-content"><section class="card chat-card" id="conversation" aria-labelledby="conversation-title"><div class="card-head"><h2 id="conversation-title">智能问答</h2><span class="badge">养护助手</span></div><div class="card-body"><p class="description">普通问答结合当前状态与历史；Agent 可自主选择环境、天气、知识及预测工具。</p><div class="mode-tabs" role="group" aria-label="问答方式"><button id="mode-ask" type="button" aria-pressed="true">普通问答</button><button id="mode-agent" type="button" aria-pressed="false">Agent 工具问答</button></div><form id="ask-form"><label for="question">你想了解什么？</label><textarea id="question" name="question" maxlength="2000" required placeholder="例如：当前绿萝需要浇水吗？"></textarea><div class="actions"><button id="ask-button" type="submit">发送问题</button><button id="example-question" class="secondary" type="button">填入综合问题</button></div></form><p class="notice" id="ask-status" role="status" aria-live="polite"></p><div id="answer-evidence" class="badges" aria-label="回答证据类型"></div><div id="answer" class="answer" aria-live="polite"></div><details id="agent-trace" hidden><summary id="agent-trace-summary">本次工具调用链</summary><p class="small">只展示实际执行记录。MODEL_OUTPUT 是预测证据，不是测量或天气数据。</p><ol class="tool-list" id="agent-tool-list"></ol></details><details id="chat-memory"><summary>问答记忆</summary><button id="load-chat" class="secondary" type="button">刷新问答历史</button><p class="notice" id="chat-status" role="status"></p><div class="history-list" id="chat-history"></div></details></div></section></div><footer class="footer"><span>GreenMate · 植物养护助手</span><span>摄影感配图由AI生成，仅作装饰；实际数据以来源标注为准。</span></footer></main></body></html>
